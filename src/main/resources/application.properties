spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/db_zonas_peligrosas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080

app.jwt.secret=CADENA_ALEATORIA_DE_AL_MENOS_32_CARACTERES
app.jwt.expiration=86400000

# RNF03: en desarrollo local se permite HTTP; en producción usar el perfil "prod"
# (o setear app.security.require-https=true) detrás de un proxy con TLS.
app.security.require-https=false
server.forward-headers-strategy=framework

# RF04: notificaciones push reales via Firebase Cloud Messaging.
# Dejar vacío mantiene el sistema funcionando por polling (GET /alertas/verificar) sin push real.
# Para activarlo: generar una cuenta de servicio en Firebase Console > Configuración del proyecto >
# Cuentas de servicio > Generar nueva clave privada, guardar ese JSON en el servidor (nunca en el
# repositorio) y apuntar aquí a su ruta absoluta.
app.firebase.credentials-path=
