spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_zonas_peligrosas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Valor solo para desarrollo local. En producción se define JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-secret-solo-para-local-no-usar-en-produccion}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.security.require-https=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.login.max-intentos=5
app.login.bloqueo-minutos=15

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Ruta al JSON de la cuenta de servicio de Firebase. Vacío desactiva el envío push.
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
