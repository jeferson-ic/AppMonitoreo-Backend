# Perfil de producción (RNF03, RNF05).
# Activar con: --spring.profiles.active=prod
#
# Exige HTTPS en todas las peticiones. Si el TLS se termina en un proxy/balanceador
# (Nginx, ALB, etc.) delante de esta app, ese proxy debe reenviar el header
# X-Forwarded-Proto; server.forward-headers-strategy=framework (en application.properties)
# ya hace que Spring reconozca esas peticiones como seguras.
# Si en cambio esta app debe terminar TLS directamente, configurar además:
#   server.ssl.key-store=classpath:keystore.p12
#   server.ssl.key-store-password=...
#   server.ssl.key-store-type=PKCS12
app.security.require-https=true

spring.jpa.show-sql=false
